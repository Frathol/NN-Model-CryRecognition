; Smart Incubator - ESP32-S3 sensor node
; Build:  pio run            Upload: pio run -t upload       Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Aktifkan Serial lewat port USB native (USB CDC). Hapus 2 baris ini jika
; Anda memakai port "UART" (CH340/CP210x) di board.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
