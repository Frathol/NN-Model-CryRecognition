# /etc/nginx/sites-available/smart-incubator
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/smart-incubator;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Kamera (live stream + rekaman) -> camera_service.py (127.0.0.1:8081).
    # Dilindungi password karena berisi video bayi. Buat akun dengan:
    #   sudo sh -c "printf 'nama:%s\n' \"\$(openssl passwd -apr1)\" > /etc/nginx/smart-incubator-camera.htpasswd"
    location /camera/ {
        auth_basic "Smart Incubator camera";
        auth_basic_user_file /etc/nginx/smart-incubator-camera.htpasswd;
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;              # wajib untuk live MJPEG
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MQTT over WebSockets -> Mosquitto (127.0.0.1:9001)
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
