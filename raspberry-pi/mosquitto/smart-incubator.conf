# /etc/mosquitto/conf.d/smart-incubator.conf
# Mosquitto 2.x — broker Smart Incubator

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/smart-incubator.acl

# persistence & persistence_location TIDAK ditulis di sini: sudah diatur di
# /etc/mosquitto/mosquitto.conf bawaan Raspberry Pi OS. Menuliskannya lagi
# membuat Mosquitto gagal start ("Duplicate persistence_location value").

# MQTT biasa untuk ESP32-S3 & layanan Python (LAN)
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets untuk dashboard browser.
# Hanya di localhost; nginx mem-proxy ws://<pi>/mqtt -> 127.0.0.1:9001
listener 9001 127.0.0.1
protocol websockets
